name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only one release at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Bundle ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          # macOS Intel build is intentionally omitted: GitHub's macos-13
          # runners are queue-starved during the Apple Silicon transition,
          # blocking the release for hours. Intel Macs can still run the
          # arm64 DMG via Rosetta 2. Add x86_64-apple-darwin back here
          # once we have local signing and run it off-CI.
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              dist-portable/Aircast-portable-windows-x64.zip
          - label: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg sidecar
        run: pnpm fetch-ffmpeg

      # Apple signing + notarization.
      #
      # tauri-bundler checks `var_os("APPLE_CERTIFICATE")`, and GitHub expands a
      # missing secret to "", which var_os reports as Some("") — so the bundler
      # runs `security import` on an empty payload and the build dies. That is
      # what forced the env vars to be dropped in 056003b. The fix is not to set
      # them empty but to not export them at all unless they are really set, so
      # a fork with no secrets still builds (unsigned) instead of failing.
      - name: Stage Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Apple signing secrets configured — building unsigned."
            exit 0
          fi
          # Heredoc form: an export password may contain characters that would
          # break a plain KEY=VALUE line.
          {
            printf 'APPLE_CERTIFICATE<<__AIRCAST_EOF__\n%s\n__AIRCAST_EOF__\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__AIRCAST_EOF__\n%s\n__AIRCAST_EOF__\n' "$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::notice::Developer ID signing enabled."

          # The notary credentials are deliberately exported under names Tauri
          # does NOT recognise. If APPLE_API_KEY/_ISSUER/_KEY_PATH were visible
          # to `tauri build`, tauri-bundler would notarize the .app itself and
          # block on Apple's notary service with no timeout we control — which
          # is exactly how a congested notary service turned a good build into
          # a hung job. We notarize afterwards, in a step whose failure
          # behaviour we own.
          if [ -n "${APPLE_API_KEY_B64:-}" ]; then
            keydir="$RUNNER_TEMP/private_keys"
            mkdir -p "$keydir"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            chmod 600 "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            {
              echo "NOTARY_KEY_ID=${APPLE_API_KEY}"
              echo "NOTARY_ISSUER=${APPLE_API_ISSUER}"
              echo "NOTARY_KEY_PATH=$keydir/AuthKey_${APPLE_API_KEY}.p8"
            } >> "$GITHUB_ENV"
            echo "::notice::Notarization enabled."
          else
            echo "::warning::Signing without notarization — macOS will still warn users."
          fi

      - name: Build Tauri bundle
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }}

      # Notarization gates the release: nothing is published unless Apple has
      # accepted the build and the ticket is stapled into the .dmg.
      #
      # v0.3.1 shipped un-stapled because this step gave up after 45 minutes
      # and continued anyway. Apple accepted it minutes later, so the download
      # does work — Gatekeeper fetches the ticket online — but an un-stapled
      # image cannot be verified offline, and publishing an artifact we could
      # not confirm is not what a signed release is for.
      #
      # The budget is therefore hours, not minutes. Apple's own guidance is
      # that most submissions finish within 15 minutes; a multi-hour wait means
      # their queue is backed up, and waiting costs nothing but runner minutes.
      # A timeout now fails the job, which skips the release job entirely
      # (it `needs: build`), so a congested day delays a release instead of
      # publishing a half-finished one. Re-running the workflow is cheap.
      #
      # We submit the .dmg rather than the .app because the notary service
      # scans the disk image's contents too, and it is the .dmg that users
      # download, so it is the .dmg that needs the stapled ticket.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.NOTARY_KEY_PATH != ''
        shell: bash
        run: |
          set -uo pipefail   # deliberately not -e: failures are handled below
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg produced."
            exit 1
          fi
          auth=(--key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")

          echo "Submitting $(basename "$dmg")"
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json | jq -r '.id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not reach the notary service."
            exit 1
          fi
          echo "Submission id: $id"

          # Poll rather than `--wait`, so a rejection and a timeout stay
          # distinguishable: `notarytool --wait` exits non-zero for both, and
          # only one of them means this build is broken.
          #
          # NOTARY_MAX_MINUTES stays well under the 360-minute job limit, with
          # room for the build that already ran.
          : "${NOTARY_MAX_MINUTES:=180}"
          polls=$(( NOTARY_MAX_MINUTES * 2 ))   # one poll every 30 s
          status="In Progress"
          started=$SECONDS
          for i in $(seq 1 "$polls"); do
            sleep 30
            status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r '.status')
            # One line a minute is enough to see progress without flooding.
            if [ $(( i % 2 )) -eq 0 ]; then
              echo "  [$(( (SECONDS - started) / 60 )) min] $status"
            fi
            [ "$status" = "In Progress" ] || break
          done

          case "$status" in
            Accepted)
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              spctl -a -vvv -t open --context context:primary-signature "$dmg"
              echo "::notice::Notarized and stapled after $(( (SECONDS - started) / 60 )) min."
              ;;
            Invalid|Rejected)
              echo "::error::Apple rejected this build."
              xcrun notarytool log "$id" "${auth[@]}" || true
              exit 1
              ;;
            *)
              echo "::error::Apple did not answer within ${NOTARY_MAX_MINUTES} min (status: $status). \
          Nothing has been published. Re-run this workflow once their queue clears; \
          submission $id can also be inspected with: xcrun notarytool info $id"
              exit 1
              ;;
          esac

      # Portable Windows zip: Aircast.exe + aircast-ffmpeg.exe side-by-side,
      # no install, no admin. Just extract and run. The sidecar keeps the
      # `aircast-` prefix so it matches what `stream::ffmpeg_path::resolve`
      # looks for next to the running executable. Requires WebView2 runtime
      # on the host (default on Windows 10 1803+ and Windows 11).
      - name: Package portable Windows zip
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $portableDir = "dist-portable/Aircast-portable-windows-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/aircast.exe" "$portableDir/Aircast.exe"
          Copy-Item "src-tauri/binaries/aircast-ffmpeg-${{ matrix.target }}.exe" "$portableDir/aircast-ffmpeg.exe"
          # WebView2Loader.dll lands in the build dir on some toolchain combos.
          # Ship it when present; the app falls back to the system one otherwise.
          $loader = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/WebView2Loader.dll" -ErrorAction SilentlyContinue
          if ($loader) { Copy-Item $loader.FullName $portableDir }
          @"
          Aircast portable build for Windows x64.

          Extract this folder anywhere (Desktop, Documents, USB stick, ...) and
          double-click Aircast.exe. No installation and no admin rights are
          required.

          Requires Windows 10 1803+ or Windows 11 (WebView2 runtime is bundled
          with the operating system on those versions). On older Windows, install
          the WebView2 runtime from:
            https://developer.microsoft.com/microsoft-edge/webview2/
          "@ | Out-File -Encoding utf8 "$portableDir/README.txt"
          Compress-Archive -Path $portableDir -DestinationPath "dist-portable/Aircast-portable-windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircast-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both required by actions/attest-build-provenance: it mints a short-lived
      # OIDC token to identify this workflow run to Sigstore, then writes the
      # resulting attestation back to the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: find dist -type f | sort

      # Lets anyone check that what they downloaded is byte-for-byte what this
      # run produced. Free, and the only integrity signal Windows and Linux
      # users get until those platforms are signed.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Artifacts land in per-bundle subdirectories (dmg/, msi/, nsis/, ...)
          # because upload-artifact preserves the paths' common ancestor, but
          # the release assets are flat. Emit bare filenames so that a user who
          # downloads the assets next to SHA256SUMS can just run
          # `sha256sum -c SHA256SUMS`.
          : > SHA256SUMS
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.zip' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
              done >> SHA256SUMS
          cat SHA256SUMS

      # Cryptographically ties every artifact to this exact workflow run and
      # commit, via Sigstore. Users verify with:
      #   gh attestation verify Aircast_x.y.z_aarch64.dmg --repo Synapsr/Aircast
      # It proves provenance, not that the binary is safe — but it is the one
      # trust signal available for the unsigned Windows and Linux bundles.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/SHA256SUMS
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.app.tar.gz
            dist/**/Aircast-portable-windows-x64.zip
