name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only one release at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Bundle ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          # macOS Intel build is intentionally omitted: GitHub's macos-13
          # runners are queue-starved during the Apple Silicon transition,
          # blocking the release for hours. Intel Macs can still run the
          # arm64 DMG via Rosetta 2. Add x86_64-apple-darwin back here
          # once we have local signing and run it off-CI.
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              dist-portable/Aircast-portable-windows-x64.zip
          - label: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg sidecar
        run: pnpm fetch-ffmpeg

      # Apple signing + notarization.
      #
      # tauri-bundler checks `var_os("APPLE_CERTIFICATE")`, and GitHub expands a
      # missing secret to "", which var_os reports as Some("") — so the bundler
      # runs `security import` on an empty payload and the build dies. That is
      # what forced the env vars to be dropped in 056003b. The fix is not to set
      # them empty but to not export them at all unless they are really set, so
      # a fork with no secrets still builds (unsigned) instead of failing.
      - name: Stage Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Apple signing secrets configured — building unsigned."
            exit 0
          fi
          # Heredoc form: an export password may contain characters that would
          # break a plain KEY=VALUE line.
          {
            printf 'APPLE_CERTIFICATE<<__AIRCAST_EOF__\n%s\n__AIRCAST_EOF__\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__AIRCAST_EOF__\n%s\n__AIRCAST_EOF__\n' "$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::notice::Developer ID signing enabled."

          # Notarization uses the App Store Connect API key. Never set
          # APPLE_ID/APPLE_PASSWORD as well: the Apple-ID branch takes
          # precedence in tauri-bundler, and APPLE_ID without APPLE_TEAM_ID is
          # a hard error.
          if [ -n "${APPLE_API_KEY_B64:-}" ]; then
            keydir="$RUNNER_TEMP/private_keys"
            mkdir -p "$keydir"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            chmod 600 "$keydir/AuthKey_${APPLE_API_KEY}.p8"
            {
              echo "APPLE_API_KEY=${APPLE_API_KEY}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY_PATH=$keydir/AuthKey_${APPLE_API_KEY}.p8"
            } >> "$GITHUB_ENV"
            echo "::notice::Notarization enabled."
          else
            echo "::warning::Signing without notarization — macOS will still warn users."
          fi

      - name: Build Tauri bundle
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json --target ${{ matrix.target }}

      # Tauri notarizes and staples the .app, but only codesigns the .dmg and
      # never submits it (tauri#7533). An un-stapled .dmg still forces a
      # network round-trip on first open, and fails outright offline — so
      # staple it here.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' | head -1)
          echo "notarizing $dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg" || true

      # Portable Windows zip: Aircast.exe + aircast-ffmpeg.exe side-by-side,
      # no install, no admin. Just extract and run. The sidecar keeps the
      # `aircast-` prefix so it matches what `stream::ffmpeg_path::resolve`
      # looks for next to the running executable. Requires WebView2 runtime
      # on the host (default on Windows 10 1803+ and Windows 11).
      - name: Package portable Windows zip
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $portableDir = "dist-portable/Aircast-portable-windows-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/aircast.exe" "$portableDir/Aircast.exe"
          Copy-Item "src-tauri/binaries/aircast-ffmpeg-${{ matrix.target }}.exe" "$portableDir/aircast-ffmpeg.exe"
          # WebView2Loader.dll lands in the build dir on some toolchain combos.
          # Ship it when present; the app falls back to the system one otherwise.
          $loader = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/WebView2Loader.dll" -ErrorAction SilentlyContinue
          if ($loader) { Copy-Item $loader.FullName $portableDir }
          @"
          Aircast portable build for Windows x64.

          Extract this folder anywhere (Desktop, Documents, USB stick, ...) and
          double-click Aircast.exe. No installation and no admin rights are
          required.

          Requires Windows 10 1803+ or Windows 11 (WebView2 runtime is bundled
          with the operating system on those versions). On older Windows, install
          the WebView2 runtime from:
            https://developer.microsoft.com/microsoft-edge/webview2/
          "@ | Out-File -Encoding utf8 "$portableDir/README.txt"
          Compress-Archive -Path $portableDir -DestinationPath "dist-portable/Aircast-portable-windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircast-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both required by actions/attest-build-provenance: it mints a short-lived
      # OIDC token to identify this workflow run to Sigstore, then writes the
      # resulting attestation back to the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: find dist -type f | sort

      # Lets anyone check that what they downloaded is byte-for-byte what this
      # run produced. Free, and the only integrity signal Windows and Linux
      # users get until those platforms are signed.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Artifacts land in per-bundle subdirectories (dmg/, msi/, nsis/, ...)
          # because upload-artifact preserves the paths' common ancestor, but
          # the release assets are flat. Emit bare filenames so that a user who
          # downloads the assets next to SHA256SUMS can just run
          # `sha256sum -c SHA256SUMS`.
          : > SHA256SUMS
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.zip' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
              done >> SHA256SUMS
          cat SHA256SUMS

      # Cryptographically ties every artifact to this exact workflow run and
      # commit, via Sigstore. Users verify with:
      #   gh attestation verify Aircast_x.y.z_aarch64.dmg --repo Synapsr/Aircast
      # It proves provenance, not that the binary is safe — but it is the one
      # trust signal available for the unsigned Windows and Linux bundles.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/SHA256SUMS
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.app.tar.gz
            dist/**/Aircast-portable-windows-x64.zip
