[package]
name = "aircast"
version = "0.2.3"
description = "Minimal Icecast streaming desktop app"
authors = ["Aircast contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/loanlaval/Aircast"
edition = "2021"
rust-version = "1.83"

[lib]
name = "aircast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-util", "process", "time", "net"] }
anyhow = "1"
thiserror = "2"

cpal = "0.15"
regex = "1"
once_cell = "1"
dirs = "5"
rodio = { version = "0.20", default-features = false, features = ["mp3", "wav", "flac", "vorbis"] }
uuid = { version = "1", features = ["v4"] }
# Tag reader for ID3 (mp3), Vorbis comments (flac/ogg/opus), iTunes atoms (mp4).
# Pure Rust, no system deps, ~150 KB compiled.
lofty = "0.21"
# Base64 encoder for HTTP Basic auth on the metadata endpoint.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
